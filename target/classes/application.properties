# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── PostgreSQL (Profile DB) ──────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/soa_profile_db
spring.datasource.username=postgres
spring.datasource.password=0602
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── SOAP Auth Service URL ────────────────────────────────────
soap.auth.url=http://localhost:8081/ws

# ── CORS (Frontend-д зөвшөөрөх) ─────────────────────────────
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500
